<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>繪本生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Andika', -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  label { display: block; font-size: 13px; color: #555; margin-top: 16px; margin-bottom: 4px; }
  select, input, textarea { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 14px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { background: #999; cursor: not-allowed; }
  #result { margin-top: 30px; }
  .img-status { font-size: 12px; color: #999; margin-top: 8px; text-align: center; }
  #error { color: #c0392b; margin-top: 16px; white-space: pre-wrap; }
  #loading { margin-top: 16px; color: #555; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  #reviewUnitsBox { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #reviewUnitsBox label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #444; margin: 0; background: #f2f2f2; padding: 4px 8px; border-radius: 6px; width: auto; }
  #reviewUnitsBox input { width: auto; margin: 0; }

  /* ---- 書頁通用 ---- */
  .book-page { margin-bottom: 14px; border-radius: 6px; overflow: hidden; }

  /* 封面：滿版插圖 + 疊字 */
  .book-page.cover { position: relative; background: #eee; min-height: 300px; }
  .book-page.cover img.cover-img { width: 100%; display: block; }
  .cover-title-overlay { position: absolute; top: 6%; left: 4%; right: 4%; text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; color: #1a1a1a; text-shadow: 0 2px 6px rgba(255,255,255,0.85), 0 0 2px rgba(255,255,255,0.85); }
  .cover-byline-overlay { position: absolute; bottom: 4%; right: 5%; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; color: #1a1a1a; text-shadow: 0 1px 4px rgba(255,255,255,0.85); }

  /* 拼貼風：彩色字母書名（圖片滿版、不加邊框） */
  body.art-collage .cover-title-overlay { top: 8%; left: 6%; right: 6%; font-size: 40px; line-height: 1.12; letter-spacing: 2px; text-transform: uppercase; -webkit-text-stroke: 5px #fff6e0; paint-order: stroke fill; text-shadow: 0 3px 6px rgba(60,40,10,0.25); }
  body.art-collage .cover-byline-overlay { bottom: 4%; right: 5%; font-size: 20px; font-weight: 800; }
  .title-word { display: inline-block; white-space: nowrap; }
  .title-letter { display: inline; }

  /* 全白扉頁 */
  .book-page.blank-page { background: #fff; min-height: 260px; }

  /* 木框頁（生字頁／文字頁／封底）— 顏色隨書的類別切換 */
  :root {
    --deco-bg: #cda653; --deco-border: #2b1d10; --deco-heading: #2b1d10; --deco-text: #1a1208;
  }
  body.theme-topic {
    --deco-bg: #e7f2df; --deco-border: #3f6b3f; --deco-heading: #2f4f2f; --deco-text: #233d23;
  }
  body.theme-sightwords {
    --deco-bg: #cda653; --deco-border: #2b1d10; --deco-heading: #2b1d10; --deco-text: #1a1208;
  }
  body.theme-phonics {
    --deco-bg: #dbe9f7; --deco-border: #1e4d7b; --deco-heading: #173d61; --deco-text: #15314f;
  }
  .deco-page { background: var(--deco-bg); border: none; padding: 54px 38px; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  /* 只有 Sight Words 才有木框，其他類型不加邊 */
  body.theme-sightwords .deco-page { border: 14px double var(--deco-border); padding: 40px 24px; }
  .deco-page .deco-heading { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; color: var(--deco-heading); margin-bottom: 14px; }
  .deco-page .story-text { font-family: 'Andika', sans-serif; font-size: var(--story-font-size, 26px); line-height: 1.7; color: var(--deco-text); }
  .deco-page .class-line { font-size: 12px; color: var(--deco-text); opacity: 0.7; margin-top: 16px; }

  /* 生字表格 */
  .vocab-grid { display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center; align-items: center; }
  .vocab-item { display: flex; align-items: center; gap: 6px; font-family: 'Andika', sans-serif; font-size: 20px; color: var(--deco-text); }
  .vocab-item img { height: 30px; border-radius: 4px; }
  .phonics-hl { color: #c0392b; font-weight: bold; }

  /* 插圖頁（無邊框滿版） */
  .book-page.image-page { background: #eee; min-height: 200px; }
  .book-page.image-page img { width: 100%; display: block; }

  /* 封底 */
  .book-page.back-cover img.face-img { width: 110px; height: auto; display: block; }

  /* 圖示替代文字 */
  .icon-slot { display: inline-block; vertical-align: middle; margin: 0 3px; }
  .icon-slot img { height: 34px; vertical-align: middle; border-radius: 4px; }
  .icon-loading { font-size: 14px; color: #6b5636; background: rgba(255,255,255,0.4); padding: 2px 6px; border-radius: 4px; }

  .recording-script { margin-top: 30px; padding: 16px; background: #eef6ff; border-radius: 10px; text-align: left; }
  .recording-script h2 { font-size: 16px; color: #1e40af; margin-top: 0; }
  .recording-script .rs-page { margin-top: 14px; padding: 10px 0; border-bottom: 1px dashed #bcd0e8; font-size: 18px; line-height: 1.9; }
  .recording-script .rs-page-num { font-size: 12px; color: #888; }

  #printBtn { display: none; background: #16a34a; }
  #fontSizeBar { display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 10px; background: #f5f5f5; border-radius: 8px; }
  #fontSizeBar span { font-size: 13px; color: #555; }
  #fontSizeBar button { margin: 0; padding: 4px 12px; font-size: 16px; background: #eee; color: #333; border: 1px solid #ccc; }

  .editable-hint { font-size: 11px; color: #16a34a; margin-top: 10px; }
  [contenteditable="true"] { outline: none; }
  [contenteditable="true"]:focus { background: rgba(255,255,255,0.5); box-shadow: 0 0 0 2px #fde68a; border-radius: 4px; }

  @media print {
    .editable-hint { display: none !important; }
    #fontSizeBar { display: none !important; }
    .no-print { display: none !important; }
    label, select, input, #generateBtn, #loading, h1, .hint { display: none !important; }
    #printBtn { display: none !important; }
    .book-page { page-break-after: always; }
    body { max-width: 100%; margin: 0; padding: 0; }
  }
</style>
</head>
<body>

<h1>繪本生成器</h1>

<label>年段 / 程度</label>
<select id="level">
  <option value="entry">入門（中班，約100-112小時）</option>
  <option value="level1" selected>Level 1（大班，約560-580小時）</option>
  <option value="level2">Level 2（約1000小時以上）</option>
</select>

<label>生成模式</label>
<select id="mode">
  <option value="topic" selected>主題故事</option>
  <option value="sight_words_advanced">Sight Words（進階版）</option>
  <option value="sight_words_entry">Sight Words（入門版）</option>
  <option value="cvc">CVC 拼讀</option>
  <option value="long_vowel">長母音拼讀</option>
</select>

<!-- 主題故事用 -->
<div id="field-topic">
  <label>主題</label>
  <input id="topic" type="text" placeholder="例：公園野餐、動物朋友" value="公園野餐" />
</div>

<!-- Sight Words 用：選單元 -->
<div id="field-unit" class="hidden">
  <label>課程單元（本月新字，鎖定）</label>
  <select id="unit"></select>
  <div class="hint" id="unit-words"></div>

  <label>複習前面單元（可選，複選）</label>
  <div id="reviewUnitsBox"></div>
</div>

<!-- CVC 用：選短母音規則 -->
<div id="field-cvcRule" class="hidden">
  <label>拼讀規則（短母音）</label>
  <select id="cvcRule">
    <option value="short_a">短母音 a</option>
    <option value="short_e">短母音 e</option>
    <option value="short_i">短母音 i</option>
    <option value="short_o">短母音 o</option>
    <option value="short_u">短母音 u</option>
  </select>
</div>

<!-- 長母音用：選規則 -->
<div id="field-longVowelRule" class="hidden">
  <label>拼讀規則（長母音）</label>
  <select id="longVowelRule">
    <option value="long_a">長母音 A（a_e / ai / ay）</option>
    <option value="long_e">長母音 E（e_e / ea / ee）</option>
    <option value="long_i">長母音 I（i_e / ie / igh）</option>
    <option value="long_o">長母音 O（o_e / oa / oe）</option>
    <option value="long_u_ju">長母音 U-[ju]（u_e）</option>
    <option value="long_u_u">長母音 U-[u]（ui / ue / oo）</option>
  </select>
</div>

<!-- CVC / 長母音用：主題物件類別（可選） -->
<div id="field-objectTopic" class="hidden">
  <label>主題物件類別（可選）</label>
  <input id="objectTopic" type="text" placeholder="例：野餐用品、動物" />
</div>

<label>插圖畫風</label>
<select id="artStyle">
  <option value="collage" selected>拼貼風（collage，撕紙拼貼質感）</option>
  <option value="clay">Clay 黏土風（立體黏土人偶質感）</option>
  <option value="watercolor">童趣水彩（柔和水彩暈染）</option>
  <option value="other">其他（自訂）</option>
</select>
<div id="field-customStyle" class="hidden">
  <label>自訂畫風描述（英文效果較好，例如：doodle line art, crayon texture）</label>
  <input id="customStyle" type="text" placeholder="請輸入畫風描述" />
</div>

<label>作者署名（會顯示在封面）</label>
<input id="authorName" type="text" placeholder="例：Joyce Lai" value="Joyce Lai" />

<label>使用班級／對象（可選，會顯示在生字頁下方）</label>
<input id="className" type="text" placeholder="例：大獅子班" />

<label>故事跨頁數</label>
<input id="storySpreads" type="number" min="2" max="8" value="4" />

<button id="generateBtn">生成故事</button>
<button id="printBtn">🖨️ 列印 / 存成 PDF</button>
<div id="fontSizeBar">
  <span>內頁文字大小：</span>
  <button id="fontDecrease" type="button">A-</button>
  <span id="fontSizeLabel">26px</span>
  <button id="fontIncrease" type="button">A+</button>
</div>

<div id="loading" style="display:none;">生成中，請稍候...</div>
<div id="error" style="display:none;"></div>
<div id="result"></div>

  artStyleSelect.addEventListener("change", updateStyleFieldVisibility);
  updateStyleFieldVisibility();

  function getStyleDescription() {
    if (artStyleSelect.value === "other") {
      return document.getElementById("customStyle").value.trim() || "children's picture book illustration style";
    }
    return STYLE_DESCRIPTIONS[artStyleSelect.value];
  }

  function getWordSource() {
    return modeSelect.value === "sight_words_entry" ? "ML" : "BL";
  }

  function populateUnitOptions() {
    const source = getWordSource();
    const units = WORD_UNITS[source];
    unitSelect.innerHTML = "";
    Object.keys(units).forEach((key) => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = key;
      unitSelect.appendChild(opt);
    });
    updateUnitWordsHint();
    populateReviewUnitCheckboxes();
  }

  function populateReviewUnitCheckboxes() {
    const source = getWordSource();
    const units = WORD_UNITS[source];
    const currentUnit = unitSelect.value;
    reviewUnitsBox.innerHTML = "";
    Object.keys(units).forEach((key) => {
      if (key === currentUnit) return;
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = key;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(key));
      reviewUnitsBox.appendChild(label);
    });
  }

  function getSelectedReviewUnits() {
    return Array.from(reviewUnitsBox.querySelectorAll("input:checked")).map((el) => el.value);
  }

  function updateUnitWordsHint() {
    const source = getWordSource();
    const words = WORD_UNITS[source][unitSelect.value] || [];
    unitWordsHint.textContent = "本單元字彙：" + words.join(", ");
  }

  function updateVisibleFields() {
    const mode = modeSelect.value;
    Object.values(fieldGroups).forEach((el) => el.classList.add("hidden"));

    if (mode === "topic") {
      fieldGroups.topic.classList.remove("hidden");
    } else if (mode === "sight_words_advanced" || mode === "sight_words_entry") {
      fieldGroups.unit.classList.remove("hidden");
      populateUnitOptions();
    } else if (mode === "cvc") {
      fieldGroups.cvcRule.classList.remove("hidden");
      fieldGroups.objectTopic.classList.remove("hidden");
    } else if (mode === "long_vowel") {
      fieldGroups.longVowelRule.classList.remove("hidden");
      fieldGroups.objectTopic.classList.remove("hidden");
    }
  }

  modeSelect.addEventListener("change", updateVisibleFields);
  unitSelect.addEventListener("change", () => {
    updateUnitWordsHint();
    populateReviewUnitCheckboxes();
  });
  updateVisibleFields();

  const btn = document.getElementById("generateBtn");
  const loadingEl = document.getElementById("loading");
  const errorEl = document.getElementById("error");
  const resultEl = document.getElementById("result");

  btn.addEventListener("click", async () => {
    const level = levelSelect.value;
    const mode = modeSelect.value;
    const storySpreads = document.getElementById("storySpreads").value;
    const sentencesPerPage = SENTENCES_PER_PAGE[level];

    const artStyle = getStyleDescription();
    const className = document.getElementById("className").value.trim();
    const authorName = document.getElementById("authorName").value.trim() || "Joyce Lai";
    const payload = { mode, level, sentencesPerPage, storySpreads, artStyle };

    if (mode === "topic") {
      payload.topic = document.getElementById("topic").value;
    } else if (mode === "sight_words_advanced" || mode === "sight_words_entry") {
      const source = getWordSource();
      const reviewUnits = getSelectedReviewUnits();
      payload.unit = unitSelect.value;
      payload.targetWords = WORD_UNITS[source][unitSelect.value];
      payload.reviewUnits = reviewUnits;
      payload.reviewWords = reviewUnits.flatMap((u) => WORD_UNITS[source][u]);
    } else if (mode === "cvc") {
      payload.vowelRule = document.getElementById("cvcRule").value;
      payload.objectTopic = document.getElementById("objectTopic").value;
    } else if (mode === "long_vowel") {
      payload.vowelRule = document.getElementById("longVowelRule").value;
      payload.objectTopic = document.getElementById("objectTopic").value;
    }

    errorEl.style.display = "none";
    resultEl.innerHTML = "";
    loadingEl.style.display = "block";
    loadingEl.textContent = "生成故事文字中，請稍候...";
    btn.disabled = true;

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const text = await res.text();

      if (!res.ok) {
        throw new Error(`伺服器回傳錯誤（${res.status}）：\n${text}`);
      }

      const data = JSON.parse(text);

      document.body.classList.toggle("art-collage", artStyleSelect.value === "collage");
      document.body.classList.remove("theme-topic", "theme-sightwords", "theme-phonics");
      if (mode === "topic") {
        document.body.classList.add("theme-topic");
      } else if (mode === "sight_words_entry" || mode === "sight_words_advanced") {
        document.body.classList.add("theme-sightwords");
      } else if (mode === "cvc" || mode === "long_vowel") {
        document.body.classList.add("theme-phonics");
      }

      // 依序組出：封面 -> 白頁 -> 生字頁 -> (插圖頁+文字頁)*N -> 封底
      renderCover(data, authorName);
      renderBlankPage();
      renderVocabPage(data, mode, payload, className);
      renderStoryPages(data, mode);
      renderBackCover();
      renderRecordingScript(data);

      loadingEl.textContent = "生成封面插圖中...";
      await generateCoverImage(data, artStyle);

      loadingEl.textContent = "文字完成，開始生成內頁插圖（每頁約10-30秒，請耐心等待）...";
      await generateAllImages(data, artStyle);

      if (mode === "sight_words_entry") {
        loadingEl.textContent = "生成圖示中（取代不識字用的文字標記）...";
        await generateIconsForEntryMode(data, artStyle);
      }

      loadingEl.style.display = "none";
      printBtn.style.display = "inline-block";
      fontSizeBar.style.display = "flex";
    } catch (err) {
      errorEl.style.display = "block";
      errorEl.textContent = "發生錯誤：\n" + err.message;
      loadingEl.style.display = "none";
    } finally {
      btn.disabled = false;
    }
  });

  const printBtn = document.getElementById("printBtn");
  printBtn.addEventListener("click", () => window.print());

  const fontSizeBar = document.getElementById("fontSizeBar");
  const fontSizeLabel = document.getElementById("fontSizeLabel");
  let currentFontSize = 26;

  function applyFontSize() {
    document.documentElement.style.setProperty("--story-font-size", currentFontSize + "px");
    fontSizeLabel.textContent = currentFontSize + "px";
  }

  document.getElementById("fontIncrease").addEventListener("click", () => {
    if (currentFontSize < 44) currentFontSize += 2;
    applyFontSize();
  });
  document.getElementById("fontDecrease").addEventListener("click", () => {
    if (currentFontSize > 14) currentFontSize -= 2;
    applyFontSize();
  });

  // ---------- 封面（滿版插圖 + 疊字，標題與作者名都是網頁文字，不是畫進圖片裡，確保清楚好讀） ----------
  function renderCover(data, authorName) {
    const rawTitle = data.title || "";
    const letterColors = ["#d6422a", "#f2a02a", "#2fa84f", "#9b59a5", "#2a74a8"];
    let colorIdx = 0;
    const title = document.body.classList.contains("art-collage")
      ? rawTitle.split(" ").map((word) =>
          `<span class="title-word">${Array.from(word).map((ch) => {
            const c = letterColors[colorIdx++ % letterColors.length];
            return `<span class="title-letter" style="color:${c}">${escapeHtml(ch)}</span>`;
          }).join("")}</span>`
        ).join(" ")
      : escapeHtml(rawTitle);
    const html = `
      <div class="book-page cover" id="cover-page">
        <div id="cover-img-slot"></div>
        <div class="cover-title-overlay">${title}</div>
        <div class="cover-byline-overlay">by ${escapeHtml(authorName)}</div>
      </div>
      <div class="img-status" id="cover-img-status">封面插圖生成中...</div>
    `;
    resultEl.insertAdjacentHTML("beforeend", html);
  }

  async function generateCoverImage(data, artStyle) {
    const statusEl = document.getElementById("cover-img-status");
    const slotEl = document.getElementById("cover-img-slot");
    const coverPrompt = `Children's picture book front cover illustration for a story titled "${data.title || ""}", ${artStyle}, no text or letters in the image, warm inviting composition, portrait orientation`;

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "generateImage", prompt: coverPrompt }),
      });
      const text = await res.text();
      if (!res.ok) {
        if (statusEl) statusEl.textContent = `封面插圖生成失敗：${text}`;
        return;
      }
      const imgData = JSON.parse(text);
      if (imgData.imageBase64 && slotEl) {
        const img = document.createElement("img");
        img.className = "cover-img";
        img.src = `data:${imgData.mimeType};base64,${imgData.imageBase64}`;
        slotEl.appendChild(img);
        if (statusEl) statusEl.textContent = "";
      }
    } catch (e) {
      if (statusEl) statusEl.textContent = `封面插圖發生錯誤：${e.message}`;
    }
  }

  // ---------- 全白扉頁 ----------
  function renderBlankPage() {
    resultEl.insertAdjacentHTML("beforeend", `<div class="book-page blank-page"></div>`);
  }

  // ---------- 生字頁（木框卡其色，CVC/長母音會標色重點發音） ----------
  const STOP_WORDS = new Set(["a","an","the","is","it","in","on","to","and","was","are","of","that","this","with","for","at","by","so"]);

  function extractVocabulary(data, payload) {
    if (payload.targetWords) {
      return [...new Set([...(payload.targetWords || []), ...(payload.reviewWords || [])])]
        .map((w) => w.split("/")[0]);
    }
    const words = new Set();
    (data.pages || []).forEach((page) => {
      (page.text || "").replace(/\(icon:[^)]*\)/gi, "").split(/[^A-Za-z']+/).forEach((w) => {
        const lw = w.toLowerCase();
        if (lw.length > 1 && !STOP_WORDS.has(lw)) {
          words.add(w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
        }
      });
    });
    return [...words].slice(0, 14);
  }

  const PHONICS_PATTERNS = {
    short_a: /a/i, short_e: /e/i, short_i: /i/i, short_o: /o/i, short_u: /u/i,
    long_a: /(a[a-z]e\b)|(ai)|(ay)/i,
    long_e: /(e[a-z]e\b)|(ea)|(ee)/i,
    long_i: /(i[a-z]e\b)|(ie)|(igh)/i,
    long_o: /(o[a-z]e\b)|(oa)|(oe)/i,
    long_u_ju: /(u[a-z]e\b)/i,
    long_u_u: /(ui)|(ue)|(oo)/i,
  };

  function highlightPhonics(word, vowelRule) {
    const pattern = PHONICS_PATTERNS[vowelRule];
    if (!pattern) return escapeHtml(word);
    const match = word.match(pattern);
    if (!match) return escapeHtml(word);
    const idx = match.index;
    const len = match[0].length;
    const before = escapeHtml(word.slice(0, idx));
    const target = escapeHtml(word.slice(idx, idx + len));
    const after = escapeHtml(word.slice(idx + len));
    return `${before}<span class="phonics-hl">${target}</span>${after}`;
  }

  function renderVocabPage(data, mode, payload, className) {
    const vocab = extractVocabulary(data, payload || {});
    const vowelRule = payload.vowelRule;
    const showIcons = mode === "sight_words_entry";

    const itemsHtml = vocab.map((w) => {
      const wordHtml = vowelRule ? highlightPhonics(w, vowelRule) : escapeHtml(w);
      const idSafe = w.replace(/[^a-zA-Z0-9]/g, "_");
      const iconHtml = showIcons
        ? `<span class="icon-slot" data-icon-name="${escapeHtml(w)}" id="vocab-icon-${idSafe}"></span>`
        : "";
      return `<span class="vocab-item">${iconHtml}${wordHtml}</span>`;
    }).join("");

    const classLine = className ? `<div class="class-line">${escapeHtml(className)}</div>` : "";

    const html = `
      <div class="book-page deco-page" id="vocab-page">
        <div class="deco-heading">生字 Words</div>
        <div class="vocab-grid" contenteditable="true">${itemsHtml || "（無）"}</div>
        ${classLine}
        <div class="editable-hint no-print">👆 點這裡可以直接編輯／增刪文字</div>
      </div>
    `;
    resultEl.insertAdjacentHTML("beforeend", html);
  }

  // ---------- 內頁：每個 page 拆成「插圖頁」+「文字頁」交替 ----------
  function renderTextWithIconSlots(text) {
    return escapeHtml(text || "").replace(/\(icon:\s*([^)]+)\)/gi, (match, iconName) => {
      const safeName = iconName.trim();
      const idSafe = safeName.replace(/[^a-zA-Z0-9]/g, "_") + "_" + Math.random().toString(36).slice(2, 7);
      return `<span class="icon-slot" data-icon-name="${escapeHtml(safeName)}" id="icon-${idSafe}"><span class="icon-loading">(${escapeHtml(safeName)})</span></span>`;
    });
  }

  function renderStoryPages(data, mode) {
    let html = "";
    (data.pages || []).forEach((page) => {
      html += `
        <div class="book-page image-page" id="imgpage-${page.page_number}">
          <div id="img-slot-${page.page_number}"></div>
        </div>
        <div class="img-status no-print" id="img-status-${page.page_number}">第 ${page.page_number} 頁插圖生成中...</div>
        <div class="book-page deco-page">
          <div class="story-text" contenteditable="true">${renderTextWithIconSlots(page.text)}</div>
        </div>
      `;
    });
    resultEl.insertAdjacentHTML("beforeend", html);
  }

  async function generateAllImages(data, artStyle) {
    const pages = data.pages || [];
    for (const page of pages) {
      const statusEl = document.getElementById(`img-status-${page.page_number}`);
      const slotEl = document.getElementById(`img-slot-${page.page_number}`);
      if (statusEl) statusEl.textContent = `第 ${page.page_number} 頁插圖生成中...`;

      const finalImagePrompt = `${page.image_prompt}, ${artStyle}`;
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "generateImage", prompt: finalImagePrompt }),
        });
        const text = await res.text();

        if (!res.ok) {
          if (statusEl) statusEl.textContent = `第 ${page.page_number} 頁插圖生成失敗：${text}`;
          continue;
        }

        const imgData = JSON.parse(text);
        if (imgData.imageBase64 && slotEl) {
          const img = document.createElement("img");
          img.src = `data:${imgData.mimeType};base64,${imgData.imageBase64}`;
          slotEl.appendChild(img);
          if (statusEl) statusEl.textContent = "插圖完成 ✓";
        } else if (statusEl) {
          statusEl.textContent = `第 ${page.page_number} 頁插圖回應格式異常`;
        }
      } catch (e) {
        if (statusEl) statusEl.textContent = `第 ${page.page_number} 頁插圖發生錯誤：${e.message}`;
      }
    }
  }

  // ---------- 入門版：(icon: xxx) 換成真的小圖示，生字頁跟內頁都會用到 ----------
  async function generateIconsForEntryMode(data, artStyle) {
    const iconNames = new Set();
    (data.pages || []).forEach((page) => {
      const matches = (page.text || "").matchAll(/\(icon:\s*([^)]+)\)/gi);
      for (const m of matches) iconNames.add(m[1].trim());
    });
    document.querySelectorAll("[data-icon-name]").forEach((el) => iconNames.add(el.getAttribute("data-icon-name")));

    for (const name of iconNames) {
      const prompt = `Simple flat icon illustration of "${name}", single object centered, plain white background, colorful, flashcard style for young children, no text`;
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "generateImage", prompt }),
        });
        const text = await res.text();
        if (!res.ok) continue;
        const imgData = JSON.parse(text);
        if (imgData.imageBase64) {
          const src = `data:${imgData.mimeType};base64,${imgData.imageBase64}`;
          document.querySelectorAll(`[data-icon-name="${CSS.escape(name)}"]`).forEach((slot) => {
            slot.innerHTML = `<img src="${src}" alt="${escapeHtml(name)}" />`;
          });
        }
      } catch (e) {
        // 單一圖示失敗不影響其他圖示
      }
    }
  }

  // ---------- 封底：只放小臉圖 ----------
  function renderBackCover() {
    resultEl.insertAdjacentHTML("beforeend", `
      <div class="book-page deco-page back-cover">
        <img class="face-img" src="${AVATAR_URL}" alt="Michelle" />
      </div>
    `);
  }

  // ---------- 錄音稿（不印，只在網頁上看） ----------
  function renderRecordingScript(data) {
    let html = `<div class="no-print recording-script">
      <h2>🎙️ 朗讀錄音稿（給妳錄音用，不會印在書裡）</h2>`;
    (data.pages || []).forEach((page) => {
      const readable = formatNarrationForRecording(page.narration_script || page.text || "");
      html += `
        <div class="rs-page">
          <div class="rs-page-num">第 ${page.page_number} 頁</div>
          <div>${readable}</div>
        </div>
      `;
    });
    html += `</div>`;
    resultEl.insertAdjacentHTML("beforeend", html);
  }

  function formatNarrationForRecording(raw) {
    const withMarkers = (raw || "").replace(
      /<break\s+time="(\d+)ms"\s*\/>/gi,
      (m, ms) => `\n【⏸ 停頓 ${(ms / 1000).toFixed(1)} 秒】\n`
    );
    return escapeHtml(withMarkers).replace(/\n/g, "<br>");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
